name: sync-notion-content
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install firebase-admin
      - name: sync people
        run: node people.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PEOPLE_DB: ${{ secrets.NOTION_PEOPLE_DB }}
      - name: sync content
        if: always()
        run: node sync.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CONTENT_DB: ${{ secrets.NOTION_CONTENT_DB }}
          NOTION_PEOPLE_DB: ${{ secrets.NOTION_PEOPLE_DB }}
      - name: sync equipment
        if: always()
        run: node equipment.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EQUIPMENT_DB: ${{ secrets.NOTION_EQUIPMENT_DB }}
